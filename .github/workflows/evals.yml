name: Eval

# KHONG chay moi commit: moi lan chay goi model that va ton tien that.
on:
  schedule:
    # 19:00 UTC = 02:00 gio Viet Nam. Chay khi khong ai dang lam viec.
    - cron: '0 19 * * *'
  workflow_dispatch:
  pull_request:
    # Chi khi PR dung vao thu THAT SU doi ket qua eval. Sua mot dong log thi khong.
    paths:
      - 'src/agents/prompt/**'
      - 'src/knowledge/**'
      - 'src/llm/models.py'
      - 'src/llm/reranker.py'
      - 'evals/**'
      # Duong lam tho co bo danh gia rieng o buoc cuoi luong nay.
      - 'src/tho/**'

jobs:
  eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: chatbot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bot -d chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      NODE_ENV: test
      LOG_LEVEL: error
      DATABASE_URL: postgres://bot:bot@localhost:5432/chatbot
      REDIS_URL: redis://localhost:6379
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_DIM: '1024'
      RERANK_PROVIDER: ${{ secrets.RERANK_PROVIDER || 'fake' }}
      RERANK_MODEL: ${{ secrets.RERANK_MODEL || 'fake' }}
      RERANK_API_KEY: ${{ secrets.RERANK_API_KEY || 'fake' }}
      RERANK_MIN_SCORE: '0.55'
      BOT_MENTION_NAME: CP_Assistant,CP,Bot_CP_Assistant
      # BAT BUOC cho che do --qua-cong-cu. Mac dinh cua schema la
      # GROUP_POLICY=allowlist / DM_POLICY=pairing, ma che do do sinh thread_id moi
      # cho moi cau hoi — tuc tang truy cap se chan SACH, `handle_message` tra ve
      # "khong tra loi", va eval se cham 50 cau rong roi in ra mot bao cao sai.
      GROUP_POLICY: open
      DM_POLICY: open
      DAILY_BUDGET_USD: '5'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBEDDING_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # Khong co khoa that thi eval khong noi len dieu gi — nhung do la mot LUA CHON
      # hop le cua chu repo, khong phai mot hong hoc. Bao vang roi dung, KHONG do.
      #
      # Day dung la lo ma buoc "Chay eval" duoi kia da tranh bang ma thoat 2: mot job
      # nightly do moi dem vi mot viec co y chua lam la mot job khong ai doc nua.
      # Hai cho phai theo cung mot luat, neu khong thi luat do chi la mot cau noi.
      - name: Kiem tra khoa
        id: khoa
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning title=Eval KHONG chay::Thieu secret OPENAI_API_KEY."
            echo "co_khoa=false" >> "$GITHUB_OUTPUT"
            echo '{"status":"not_run","reason":"missing_provider_secret","release_gate_b_accepted":false}' > eval-status.json
            echo 'RAG eval: NOT RUN (missing provider secret). Gate B is not accepted.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "co_khoa=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.khoa.outputs.co_khoa == 'true'
        with:
          python-version: "3.11"
          enable-cache: true

      # KHONG `--all-groups`: nhom `rlvr` keo theo torch (~2,5 GB) ma luong nay khong
      # dung mot dong nao cua no. Luong nay chay danh gia RAG, khong cham toi rlvr/.
      #
      # ci.yml thi VAN dung `--all-groups`, co chu dich: o do mypy kiem bien gioi voi
      # `trl`, va chinh phep kiem do vua bat mot loi hop dong that (`reward_funcs` doi
      # `list[float | None]`, ta khai `list[float]`).
      - run: uv sync --frozen --group dev
        if: steps.khoa.outputs.co_khoa == 'true'

      - name: Migrate
        if: steps.khoa.outputs.co_khoa == 'true'
        run: uv run python -m main.cli migrate

      - name: Kiem tra hop dong golden dataset
        if: steps.khoa.outputs.co_khoa == 'true'
        run: |
          set +e
          uv run python -m evals.dataset_contract evals/dataset/golden.jsonl > dataset-contract.json
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "::warning title=Golden dataset chua du::Coverage/review not ready; development is exploratory, Gate B is not accepted."
            exit 0
          fi
          exit $code

      # Tai lieu that KHONG nam trong repo (chung la tai lieu noi bo). Buoc nay chi
      # chay khi co thu muc evals/corpus/ — do la cho de dat mot ban sao dung cho eval.
      - name: Nap tai lieu cho eval
        id: corpus
        if: steps.khoa.outputs.co_khoa == 'true'
        run: |
          mapfile -d '' documents < <(find evals/corpus -type f \
            ! -path 'evals/corpus/README.md' ! -name '.gitkeep' \
            \( -iname '*.txt' -o -iname '*.md' -o -iname '*.pdf' -o -iname '*.docx' \) \
            -print0 | sort -z)
          if [ ${#documents[@]} -eq 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=RAG eval NOT RUN::Missing mounted corpus; README/.gitkeep are not evidence documents. Gate B is not accepted."
            echo '{"status":"not_run","reason":"missing_corpus","release_gate_b_accepted":false}' > eval-status.json
            echo 'RAG eval: NOT RUN (missing mounted corpus). Gate B is not accepted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          for f in "${documents[@]}"; do
            uv run python -m main.cli ingest "$f"
          done

      # Ma thoat 2 = placeholder/split rong/thieu annotation. Bao vang nhung KHONG
      # nghiem thu Gate B. Metadata chunk thieu/cu/sai scope la loi, khong bo qua.
      # Mac dinh chi development; khong tu chay test khi chua khoa config/review.
      # HAI MUC CHI PHI, va do la co y:
      #   nightly / bam tay  ->  golden.jsonl + --ragas + --qua-cong-cu
      #   pull_request       ->  qa.jsonl, khung cu, 3 lan goi model moi cau
      #
      # Job dem chay che do --qua-cong-cu vi do la DUONG ONG THAT: model tu viet truy
      # van roi moi goi cong cu. Che do mac dinh day thang cau hoi vao knowledge.search
      # nen no khong di qua buoc do, va no cham diem thap gia cho hai nhom cau
      # `giao_tap_hop` va `xuyen_ngon_ngu`. Do 11/09 tren cung 6 cau: Context Precision
      # 0,677 o che do mac dinh so voi 1,000 khi chay qua cong cu.
      #
      # Recall@5 now uses typed retrieval provenance, not parsed citation text.
      # Missing/error/no-tool evidence is unknown, measured empty retrieval is 0.
      # Final claims/no-answer use an additional judge requiring human calibration.
      #
      # Bon chi so RAGAS dat hon gap doi, va mot PR khong can den chung de biet minh
      # co lam tut cai gi khong. Job dem thi can, vi no la cho duy nhat nhin thay
      # chi so tach theo TUNG LOAI cau hoi — mot trung binh chung giau mat viec mot
      # loai dang hong, dung nhu da xay ra ngay 10/09/2026.
      - name: Chay eval
        if: steps.khoa.outputs.co_khoa == 'true' && steps.corpus.outputs.available == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS=""
          else
            ARGS="evals/dataset/golden.jsonl --ragas --qua-cong-cu"
          fi
          echo "Chay: uv run python -m evals.runner $ARGS"
          set +e
          uv run python -m evals.runner $ARGS --output eval-report.json
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "::warning title=Eval chua chay::Dataset/split/annotation chua du. Xem preflight; Gate B chua dat."
            echo '{"status":"not_run","reason":"insufficient_eval_data","release_gate_b_accepted":false}' > eval-status.json
            echo 'RAG eval: NOT RUN (insufficient eval data). Gate B is not accepted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "{\"status\":\"completed\",\"exit_code\":$code,\"release_gate_b_accepted\":false}" > eval-status.json
          echo "RAG development eval completed with exit code $code. Gate B is not accepted by this workflow." >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload content-free RAG eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: |
            eval-report.json
            eval-status.json
            dataset-contract.json
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------------
      # Danh gia DUONG LAM THO. Tach buoc rieng vi no khong dung chung du lieu
      # nao voi eval RAG — bo chuan tho la 40 chu de, khong phai qa.jsonl.
      #
      # `continue-on-error`: CHUA lam cong chan, co chu dich. Nguong o
      # evals/runner_tho.py moi chay 4 luot, va mot trong so do (`bot - van
      # xuoi` = 1,68) da nam duoi nguong ban dau vi NHIEU chu khong vi he thong.
      # Chinh tep nay da ghi bai hoc do cho `Answer Relevance`: "mot job do mai
      # la mot job khong ai doc nua".
      #
      # DIEU KIEN de bo `continue-on-error`: ~5 luot chay de biet tung nguong
      # dao dong bao nhieu, roi dat nguong duoi muc thap nhat quan sat duoc mot
      # khoang an toan.
      - name: Chay eval THO
        if: steps.khoa.outputs.co_khoa == 'true'
        continue-on-error: true
        run: |
          set +e
          uv run python evals/runner_tho.py --so-luot 2
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "::warning title=Eval tho chua chay::thieu bo chuan hoac khong sinh du bai."
            exit 0
          fi
          if [ $code -ne 0 ]; then
            echo "::warning title=Eval tho TRUOT::xem bang o tren. Chua lam cong chan — xem chu thich."
          fi
          exit 0
