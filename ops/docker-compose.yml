services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: chatbot
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d chatbot']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']

  api:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'python', '-m', 'main.api']
    env_file: ['../.env']
    # 127.0.0.1 o phia host: D17 — chua co auth nen khong mo ra ngoai may.
    ports: ['127.0.0.1:3000:3000']
    # WEB_BIND trong .env la 127.0.0.1, ma trong container thi do la loopback CUA
    # CONTAINER — Docker khong forward toi duoc. Trong container phai bind 0.0.0.0
    # va de rang buoc "chi localhost" cho phan ports o tren cung require_localhost()
    # o tang route lo.
    environment:
      WEB_BIND: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'arq', 'main.worker.WorkerSettings']
    env_file: ['../.env']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Nen L2, trich fact. Queue RIENG: `reply` chay max_jobs=1 de giu dung thu tu tra
  # loi, nen mot job nen vai giay se bat moi cau hoi phia sau xep hang cho no.
  maintenance:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'arq', 'main.worker.MaintenanceWorkerSettings']
    env_file: ['../.env']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Long-poll Zalo. Tach process rieng: mot loi trong vong poll khong duoc keo
  # giao dien web xuong theo.
  zalo:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'python', '-m', 'main.zalo']
    env_file: ['../.env']
    depends_on:
      redis: { condition: service_started }

volumes:
  pgdata:
  redisdata:
