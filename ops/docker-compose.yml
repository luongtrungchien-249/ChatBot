x-app: &app
  build: { context: .., dockerfile: ops/Dockerfile }
  env_file: ['${APP_ENV_FILE:-../.env}']
  environment:
    NODE_ENV: production
    WEB_AUTH_MODE: trusted_header
    WEB_BIND: 0.0.0.0
    WEB_PORT: 3000
    # Empty fails the Settings schema at startup; never inherit the native host DSN.
    DATABASE_URL: ${CONTAINER_DATABASE_URL:-}
    REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}
    ZALO_POLLING_EXPECTED: ${ZALO_POLLING_EXPECTED:-false}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  stop_grace_period: 150s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
      POSTGRES_DB: chatbot
    # Private Docker network. Host development ports live ONLY in the dev override.
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d chatbot']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    <<: *app
    profiles: ['app']
    command: ['uv', 'run', 'python', '-m', 'main.api']
    # External OIDC/signing proxy on this host; direct requests still need v2 HMAC.
    ports: ['127.0.0.1:3000:3000']

  worker:
    <<: *app
    profiles: ['app']
    command: ['uv', 'run', 'arq', 'main.worker.WorkerSettings']

  # Nen L2, trich fact. Queue RIENG: `reply` chay max_jobs=1 de giu dung thu tu tra
  # loi, nen mot job nen vai giay se bat moi cau hoi phia sau xep hang cho no.
  maintenance:
    <<: *app
    profiles: ['app']
    command: ['uv', 'run', 'arq', 'main.worker.MaintenanceWorkerSettings']

  # Long-poll Zalo. Tach process rieng: mot loi trong vong poll khong duoc keo
  # giao dien web xuong theo.
  zalo:
    <<: *app
    profiles: ['zalo']
    command: ['uv', 'run', 'python', '-m', 'main.zalo']

  # --- Theo doi. Tach `profiles` de `docker compose up` thuong khong keo chung theo:
  # mot may dev khong can hai container nua chi de nhin do thi.
  # Start with --profile app --profile monitoring; add --profile alerts for delivery.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ['monitoring']
    secrets: [metrics_scrape_token]
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './alert-rules.yml:/etc/prometheus/alert-rules.yml:ro'
      - 'promdata:/prometheus'
    # Chi localhost o phia host, giong `api`: so lieu van hanh khong phai thu cong khai.
    ports: ['127.0.0.1:9090:9090']
    # Start with --profile app; the native dev API is not this scrape target.
    depends_on: [api]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ['alerts']
    secrets: [alert_webhook_url]
    volumes:
      - './alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro'
      - 'alertdata:/alertmanager'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports: ['127.0.0.1:9093:9093']

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ['monitoring']
    # Fail before Grafana starts, including when monitoring bypasses preflight.
    # Inline script is normalized by YAML, avoiding host CRLF/executable-bit issues.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$${#GF_SECURITY_ADMIN_PASSWORD}" -lt 16 ]; then
          echo 'GRAFANA_ADMIN_PASSWORD must contain at least 16 characters' >&2
          exit 1
        fi
        exec /run.sh "$$@"
      - cp-grafana
    volumes:
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
      - './grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafanadata:/var/lib/grafana'
    environment:
      # Provision dashboard/datasource, but require the operator login to view them.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_DEFAULT_THEME: dark
    ports: ['127.0.0.1:3001:3000']
    depends_on: [prometheus]

  # --- Model tu host cho route `poem` -------------------------------------------
  #
  # KHONG chay mac dinh. Bat bang:  docker compose --profile tu-host up vllm
  #
  # PHAN CUNG LA DIEU KIEN, KHONG PHAI GOI Y. Model 26B can:
  #     bf16        ~52 GB VRAM
  #     int8/fp8    ~26 GB
  #     int4 (AWQ)  ~13-15 GB
  # MoE van phai nap TOAN BO expert vao VRAM — phan thua chi nam o phep tinh, khong
  # nam o bo nho. Cong them KV cache 2-6 GB.
  #
  # Do tren may dang phat trien (11/09/2026): RTX 3050 Ti Laptop, 4096 MiB = 4 GB.
  # THIEU khoang 3,5 lan ngay ca o int4. Model se KHONG NAP NOI — day khong phai van
  # de toc do. Xem docs/plan-lam-tho-va-tu-host.md muc 0.2.
  #
  # Chay tren CPU thi dung: MoE 4B hoat dong sinh duoc 2-8 token/giay, tuc mot bai
  # luc bat mat 15-60 giay — TE HON con so p95 hien tai, dung thu dang muon giam.
  vllm:
    profiles: ['tu-host']
    image: vllm/vllm-openai:latest
    command:
      - '--model=${POEM_MODEL_ID:-google/gemma-4-26b-a4b-it}'
      # int4 de vua VRAM nho nhat co the. Bo dong nay neu co >= 30 GB.
      - '--quantization=awq'
      # Ngu canh ngan: prompt tho ~1 KB, bai tho ~200 token. Dat rong la phi VRAM cho
      # KV cache ma khong dung toi.
      - '--max-model-len=4096'
      - '--gpu-memory-utilization=0.90'
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      # Cache trong so: khong co dong nay thi moi lan dung container la tai lai vai
      # chuc GB.
      - 'hfcache:/root/.cache/huggingface'
    # 127.0.0.1: y het cac service khac — chua co auth nen khong mo ra ngoai may.
    ports: ['127.0.0.1:8000:8000']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/health || exit 1']
      interval: 10s
      timeout: 5s
      # Nap 26B tu dia mat vai phut o lan dau. 60 lan x 10s = 10 phut.
      retries: 60

secrets:
  metrics_scrape_token:
    environment: METRICS_SCRAPE_TOKEN
  alert_webhook_url:
    # Absolute path outside Git; receiver must accept a generic Alertmanager webhook.
    file: ${ALERT_WEBHOOK_URL_FILE:-./missing-alert-webhook-url.secret}

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  alertdata:
  hfcache:
