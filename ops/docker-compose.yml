services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: chatbot
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d chatbot']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']

  api:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'python', '-m', 'main.api']
    env_file: ['../.env']
    # 127.0.0.1 o phia host: D17 — chua co auth nen khong mo ra ngoai may.
    ports: ['127.0.0.1:3000:3000']
    # WEB_BIND trong .env la 127.0.0.1, ma trong container thi do la loopback CUA
    # CONTAINER — Docker khong forward toi duoc. Trong container phai bind 0.0.0.0
    # va de rang buoc "chi localhost" cho phan ports o tren cung require_localhost()
    # o tang route lo.
    environment:
      WEB_BIND: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'arq', 'main.worker.WorkerSettings']
    env_file: ['../.env']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Nen L2, trich fact. Queue RIENG: `reply` chay max_jobs=1 de giu dung thu tu tra
  # loi, nen mot job nen vai giay se bat moi cau hoi phia sau xep hang cho no.
  maintenance:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'arq', 'main.worker.MaintenanceWorkerSettings']
    env_file: ['../.env']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Long-poll Zalo. Tach process rieng: mot loi trong vong poll khong duoc keo
  # giao dien web xuong theo.
  zalo:
    build: { context: .., dockerfile: ops/Dockerfile }
    command: ['uv', 'run', 'python', '-m', 'main.zalo']
    env_file: ['../.env']
    depends_on:
      redis: { condition: service_started }

  # --- Theo doi. Tach `profiles` de `docker compose up` thuong khong keo chung theo:
  # mot may dev khong can hai container nua chi de nhin do thi.
  # Bat bang:  docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ['monitoring']
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro', 'promdata:/prometheus']
    # Chi localhost o phia host, giong `api`: so lieu van hanh khong phai thu cong khai.
    ports: ['127.0.0.1:9090:9090']
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ['monitoring']
    volumes:
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
      - './grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafanadata:/var/lib/grafana'
    environment:
      # Dashboard va datasource deu duoc cam san tu tep, nen khong can dang nhap de
      # cau hinh gi. Van la localhost-only o phia host.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: dark
    ports: ['127.0.0.1:3001:3000']
    depends_on: [prometheus]

  # --- Model tu host cho route `poem` -------------------------------------------
  #
  # KHONG chay mac dinh. Bat bang:  docker compose --profile tu-host up vllm
  #
  # PHAN CUNG LA DIEU KIEN, KHONG PHAI GOI Y. Model 26B can:
  #     bf16        ~52 GB VRAM
  #     int8/fp8    ~26 GB
  #     int4 (AWQ)  ~13-15 GB
  # MoE van phai nap TOAN BO expert vao VRAM — phan thua chi nam o phep tinh, khong
  # nam o bo nho. Cong them KV cache 2-6 GB.
  #
  # Do tren may dang phat trien (11/09/2026): RTX 3050 Ti Laptop, 4096 MiB = 4 GB.
  # THIEU khoang 3,5 lan ngay ca o int4. Model se KHONG NAP NOI — day khong phai van
  # de toc do. Xem docs/plan-lam-tho-va-tu-host.md muc 0.2.
  #
  # Chay tren CPU thi dung: MoE 4B hoat dong sinh duoc 2-8 token/giay, tuc mot bai
  # luc bat mat 15-60 giay — TE HON con so p95 hien tai, dung thu dang muon giam.
  vllm:
    profiles: ['tu-host']
    image: vllm/vllm-openai:latest
    command:
      - '--model=${POEM_MODEL_ID:-google/gemma-4-26b-a4b-it}'
      # int4 de vua VRAM nho nhat co the. Bo dong nay neu co >= 30 GB.
      - '--quantization=awq'
      # Ngu canh ngan: prompt tho ~1 KB, bai tho ~200 token. Dat rong la phi VRAM cho
      # KV cache ma khong dung toi.
      - '--max-model-len=4096'
      - '--gpu-memory-utilization=0.90'
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      # Cache trong so: khong co dong nay thi moi lan dung container la tai lai vai
      # chuc GB.
      - 'hfcache:/root/.cache/huggingface'
    # 127.0.0.1: y het cac service khac — chua co auth nen khong mo ra ngoai may.
    ports: ['127.0.0.1:8000:8000']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/health || exit 1']
      interval: 10s
      timeout: 5s
      # Nap 26B tu dia mat vai phut o lan dau. 60 lan x 10s = 10 phut.
      retries: 60

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  hfcache:
