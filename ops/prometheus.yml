# Prometheus chi lam mot viec: scrape /api/metrics roi giu lich su.
#
# Chu ki 30s chu khong 15s: moi lan scrape la vai cau GROUP BY tren usage_log. So
# lieu o day la chi phi va do tre theo ngay — 30s da du min, va nua so cau truy van.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: cp-assistant
    metrics_path: /api/metrics
    static_configs:
      # Ten service trong docker-compose. Trong container, `api` bind 0.0.0.0:3000.
      - targets: ['api:3000']
        labels:
          service: cp-assistant
