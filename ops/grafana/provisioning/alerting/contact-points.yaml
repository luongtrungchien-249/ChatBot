# Notifications: Prometheus -> Alertmanager -> configured operator URL.
# Replace the old self-health endpoint; it never delivered an operator notification.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: cp-assistant
    receivers:
      - uid: cp-mac-dinh
        type: prometheus-alertmanager
        settings:
          url: http://alertmanager:9093
policies:
  - orgId: 1
    receiver: cp-assistant
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
