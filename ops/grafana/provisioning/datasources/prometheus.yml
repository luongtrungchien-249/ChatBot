# Cam san nguon du lieu de khong ai phai bam tay sau moi lan dung lai stack.
apiVersion: 1

datasources:
  - name: Prometheus
    # uid PHAI khai tuong minh va PHAI khop `datasourceUid` trong alerting/rules.yaml.
    # Bo trong thi Grafana tu sinh mot uid ngau nhien, va moi luat canh bao tro toi
    # "prometheus" se khong gan duoc vao dau — chung hien trong giao dien nhu bi hong,
    # khong co dong nao noi vi sao.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
